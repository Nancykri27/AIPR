<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        nav {
            background-color: #444;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 1rem 1.5rem;
            transition: background-color 0.3s;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        main {
            flex: 1;
            text-align: center;
            padding: 3rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        main h2 {
            margin-bottom: 1rem;
            color: #333;
        }

        main p {
            font-size: 1.1rem;
            color: #666;
        }

        .login-form {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #333;
        }

        .error-message {
            color: #d9534f;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #555;
        }

        .success-message {
            color: #5cb85c;
            font-size: 1rem;
            margin-top: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        footer {
            background-color: #d3d3d3;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
            }

            nav ul li a {
                text-align: center;
            }

            main {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Student Info Portal</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h2>Welcome to the Student Info Portal</h2>
        <p>Your one-stop solution for all student-related information.</p>
        
        <div class="login-form">
            <h3>Login</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username">
                    <div class="error-message" id="usernameError">Username cannot be empty</div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                    <div class="error-message" id="passwordError">Password cannot be empty</div>
                </div>
                <button type="submit" class="submit-btn">Login</button>
                <div class="success-message" id="successMessage">Login successful!</div>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Student Info Portal. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form elements
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const successMessage = document.getElementById('successMessage');
            
            // Reset error messages
            usernameError.classList.remove('show');
            passwordError.classList.remove('show');
            successMessage.classList.remove('show');
            
            let isValid = true;
            
            // Validate username
            if (username.value.trim() === '') {
                usernameError.classList.add('show');
                isValid = false;
            }
            
            // Validate password
            if (password.value.trim() === '') {
                passwordError.classList.add('show');
                isValid = false;
            }
            
            // If validation passes
            if (isValid) {
                successMessage.classList.add('show');
                // Optionally reset form
                // this.reset();
            }
        });
    </script>
</body>
</html>
